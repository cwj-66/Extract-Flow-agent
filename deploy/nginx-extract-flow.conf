# 插入 chenwj.click 的 HTTPS server 块；复用现有作品集访问验证。
location = /extract-flow {
    return 302 /extract-flow/;
}

location ^~ /extract-flow/api/ {
    auth_request /_portfolio_auth;
    # API 返回明确的 401，避免前端将登录页误当 JSON。
    client_max_body_size 100m;
    proxy_pass http://127.0.0.1:15178/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-User-Id $http_x_user_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_cache off;
}

location ^~ /extract-flow/assets/ {
    proxy_pass http://127.0.0.1:15178/assets/;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /extract-flow/ {
    auth_request /_portfolio_auth;
    error_page 401 = @portfolio_login;
    proxy_pass http://127.0.0.1:15178/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store" always;
}
