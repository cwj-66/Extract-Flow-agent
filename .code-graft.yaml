# 迁入代码的来源清单。再同步时按 sha 取上游，保留本地改过的文件。
grafts:
  - name: demo-seed
    source: SAHARIARSHOWMIK/ai-document-processing-automation
    sha: ddb4085
    target: app/services/
    files:
      - app/services/demo_documents.py → app/services/demo_reports.py
      - app/services/demo_seed.py → app/services/demo_seed.py
    trimmed:
      - invoice/receipt/purchase_order/contract sample texts
      - Document ORM, is_demo column, audit log_event
      - POST /demo/bootstrap approval and export path
    notes: >
      MIT, Copyright (c) 2026 Your Name. Seed becomes pending_confirm
      research-report tasks with precomputed fields. No model call.
  - name: report-validation
    source: SAHARIARSHOWMIK/ai-document-processing-automation
    sha: ddb4085
    target: app/extractor/validation.py
    files:
      - app/models.py ValidationLevel, ValidationStatus → app/extractor/validation.py
      - app/schemas/__init__.py ValidationIssue → app/extractor/validation.py
      - app/services/validation_engine.py → app/extractor/validation.py
    trimmed:
      - invoice, receipt, purchase order, and contract validators
      - duplicate lookup against other documents
      - confidence threshold and REQUIRES_REVIEW
      - audit log and document status change
    notes: >
      MIT, Copyright (c) 2026 Your Name. Issues are computed on read
      for research-report fields. They do not block confirm.
  - name: audit-log
    source: SAHARIARSHOWMIK/ai-document-processing-automation
    sha: ddb4085
    target: app/services/audit.py
    files:
      - app/services/audit.py → app/services/audit.py
      - app/models.py AuditLog → app/db/models.py AuditLogRow
      - app/routers/dashboard.py list_audit_logs → app/api/routers/ops.py
    trimmed:
      - integer document_id
      - invoice event types document_classified, document_approved, document_rejected
    notes: >
      MIT, Copyright (c) 2026 Your Name. Events use string task ids.
      Upload, parse, extract, field edit, send, and export write rows.
      A failed audit write does not fail the task.
  - name: operations-dashboard
    source: SAHARIARSHOWMIK/ai-document-processing-automation
    sha: ddb4085
    target: app/services/dashboard.py
    files:
      - app/routers/dashboard.py get_metrics/get_overview → app/services/dashboard.py
    trimmed:
      - document type distribution
      - automation_rate
      - average classification confidence
    notes: >
      MIT, Copyright (c) 2026 Your Name. Overview adds validation mix,
      extract latency, estimated cost, and human edit rate from send logs.
  - name: sent-export
    source: SAHARIARSHOWMIK/ai-document-processing-automation
    sha: ddb4085
    target: app/services/export.py
    files:
      - app/services/export.py → app/services/export.py
      - app/models.py ExportLog → app/db/models.py ExportLogRow
    trimmed:
      - approved/exported status change
      - invoice field envelopes
      - one ExportLog row per document
    notes: >
      MIT, Copyright (c) 2026 Your Name. Only sent tasks export.
      Data is the confirm-time final_fields snapshot. Task status stays sent.
  - name: demo-bootstrap
    source: SAHARIARSHOWMIK/ai-document-processing-automation
    sha: ddb4085
    target: app/services/demo_bootstrap.py
    files:
      - app/routers/dashboard.py bootstrap_demo → app/services/demo_bootstrap.py
    trimmed:
      - process_document_pipeline
      - approve, reject, request_correction, export_documents_json
      - invoice scenario names
    notes: >
      MIT, Copyright (c) 2026 Your Name. Samples land in pending_confirm,
      sent, and failed-without a model call.

