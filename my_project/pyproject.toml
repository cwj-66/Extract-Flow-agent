[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[project]
name = "my-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=3.0.0",
    "doclayout-yolo>=0.0.2",
    "einops>=0.8.2",
    "llama-parse",
    "mineru[core]>=3.4.0",
    "openai>=2.45.0",
    "pycocotools>=2.0.0",
    "pymupdf",
    "requests",
    "trafilatura",
]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
