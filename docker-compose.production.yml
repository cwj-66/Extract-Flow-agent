# chenwj.click 的 4GB 部署：云端解析、单任务并发、只向本机反向代理开放入口。
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30", "-c", "work_mem=2MB"]
    environment:
      POSTGRES_USER: extract
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置数据库密码}
      POSTGRES_DB: extract_flow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extract -d extract_flow"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 64m
    command: ["redis-server", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_LOCAL_MINERU: "false"
    restart: unless-stopped
    mem_limit: 1280m
    cpus: 1.0
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--root-path", "/extract-flow/api", "--forwarded-allow-ips", "*"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: postgresql+psycopg://extract:${POSTGRES_PASSWORD:?请设置数据库密码}@postgres:5432/extract_flow
      REDIS_URL: redis://redis:6379/0
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?请配置 DashScope API Key}
      DASHSCOPE_MODEL: qwen3.8-27b
      LLM_REQUEST_TIMEOUT_SEC: "90"
      LLM_MAX_RETRIES: "2"
      LLM_INPUT_CNY_PER_MILLION: "3"
      LLM_OUTPUT_CNY_PER_MILLION: "12"
      MINERU_MODE: cloud
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:?请配置 MinerU Token}
      MINERU_API_BASE_URL: https://mineru.net
      MINERU_MODEL_VERSION: vlm
      MINERU_LANGUAGE: ch
      MINERU_TIMEOUT_SEC: "1200"
      USE_CELERY: "false"
      PIPELINE_CONCURRENCY: "1"
      PIPELINE_MAX_PENDING: "10"
      UPLOAD_RATE_LIMIT_ENABLED: "true"
      UPLOAD_VISITOR_PER_MINUTE: "5"
      UPLOAD_IP_PER_MINUTE: "30"
      DECOMPOSER_ENABLED: "true"
      DECOMPOSER_BATCH_SIZE: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /extract-flow/api
        VITE_BASE_PATH: /extract-flow/
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:15178:80"
    logging: *logging

volumes:
  pgdata:
